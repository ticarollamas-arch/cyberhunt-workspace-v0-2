# sudo systemctl edit ollama  -> cole este conteúdo
[Service]
# Só escuta localmente; nunca exponha o Ollama na internet.
Environment="OLLAMA_HOST=127.0.0.1:11434"
# Em ~8 GB de RAM: um modelo por vez, uma requisição por vez.
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_KEEP_ALIVE=5m"
